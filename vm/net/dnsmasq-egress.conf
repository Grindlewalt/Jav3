# Logged DNS + single-lease DHCP for the brain guest (A1). The guest may resolve
# anything (every query logged — the monitoring signal); it can *connect* only to
# the host proxy, which does its own resolution for the CONNECT target. The MAC
# pin guarantees a rebuilt image still gets the one fixed address.
interface=jvtap0
bind-interfaces
no-hosts
dhcp-range=10.201.0.2,10.201.0.2,255.255.255.0,12h
dhcp-host=52:54:00:12:34:60,10.201.0.2
dhcp-option=option:router,10.201.0.1
dhcp-option=option:dns-server,10.201.0.1
dhcp-authoritative
log-queries=extra
log-dhcp
log-facility=/var/log/jarvis-vm/dns.log
