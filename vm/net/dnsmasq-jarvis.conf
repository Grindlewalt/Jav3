# dnsmasq for the Jarvis VM tap: DHCP (single lease, the guest always gets
# 10.66.0.10) + DNS with full query logging. The guest can *resolve* anything —
# every lookup is logged to /var/log/jarvis-vm/dns.log — but can *connect*
# nowhere except nftables-approved destinations.
interface=jvtap0
bind-interfaces
no-hosts
dhcp-range=10.66.0.10,10.66.0.10,255.255.255.0,12h
# pin the address to the guest's (fixed) QEMU MAC so a rebuilt image with a
# fresh machine-id/client-id still gets 10.66.0.10 instead of "no address
# available" against a stale single-address lease
dhcp-host=52:54:00:12:34:56,10.66.0.10
dhcp-option=option:router,10.66.0.1
dhcp-option=option:dns-server,10.66.0.1
dhcp-authoritative
log-queries=extra
log-dhcp
log-facility=/var/log/jarvis-vm/dns.log
