# Logged DNS for EVERY box (multi-box mode, vm_boxes_enabled) + the shared
# box's single pinned DHCP lease. bind-dynamic listens on each jvtap* address
# as net_box.sh creates it; nft pins keep each box to its own host address, so
# a box can only ever query the resolver on its own tap. Non-shared boxes are
# configured statically from box.json and never ask for a lease.
interface=jvtap*
except-interface=lo
bind-dynamic
no-hosts
dhcp-range=10.201.0.2,10.201.0.2,255.255.255.0,12h
dhcp-host=52:54:00:12:34:60,10.201.0.2
dhcp-option=option:router,10.201.0.1
dhcp-option=option:dns-server,10.201.0.1
dhcp-authoritative
log-queries=extra
log-dhcp
log-facility=/var/log/jarvis-vm/dns.log
