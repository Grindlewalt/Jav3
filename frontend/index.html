<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <script>
      // stamp the theme before first paint so a light-theme reload never
      // flashes dark (App keeps it in sync from then on)
      try {
        var t = localStorage.getItem('jarvis.theme')
          || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
        // the browser/status-bar chrome too, or a light reload frames the
        // app in dark chrome until React mounts
        document.querySelector('meta[name="theme-color"]')
          .setAttribute('content', t === 'light' ? '#ece7da' : '#0a0a0b');
      } catch (e) { /* storage blocked — default dark */ }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jarvis" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Jarvis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
