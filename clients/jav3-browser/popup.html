<!doctype html>
<html><head><meta charset="utf-8"><title>Jav3</title><link rel="stylesheet" href="style.css"></head>
<body class="popup">
  <h1><span id="dot" class="dot"></span>Jav3 <span id="status" class="mute"></span></h1>
  <div id="err" class="err"></div>
  <button id="pause" class="big">Pause Jav3</button>
  <div class="mute" id="pausedNote"></div>
  <div id="asksBox" hidden>
    <h2>Waiting for you</h2>
    <ul id="asks"></ul>
  </div>
  <h2>Sites</h2>
  <ul id="sites"></ul>
  <div class="row" style="margin-top:14px">
    <button id="options">Settings</button>
    <button id="disconnect" class="danger">Disconnect</button>
  </div>
  <script type="module" src="popup.js"></script>
</body></html>
